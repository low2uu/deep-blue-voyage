plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'io.github.low2uu.deepbluevoyage'
version = '0.1.7'
base { archivesName = 'dbv-world' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // Compile against the exact installed releases; do not bundle another physics engine.
    compileOnly 'maven.modrinth:sable:fg9dTRz9'
    compileOnly 'maven.modrinth:create-aeronautics-toolgun:pcD0Yutw'
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
    compileOnly 'maven.modrinth:create-deep-seas:8CV1LRTl'
    compileOnly 'maven.modrinth:create:UjX6dr61'
    compileOnly 'maven.modrinth:create-diesel-generators:UoPH8lO1'
    // Create already bundles this at runtime; expose its superclass API for CDG engine calls.
    compileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    // Exact approved releases; these are the first enabled batch of the pack.
    localRuntime 'maven.modrinth:create:UjX6dr61'
    localRuntime 'maven.modrinth:architectury-api:1IiqEQGl'
    localRuntime 'maven.modrinth:sable:fg9dTRz9'
    localRuntime 'maven.modrinth:create-aeronautics:44pLdPGg'
    localRuntime 'maven.modrinth:create-deep-seas:8CV1LRTl'
    localRuntime 'maven.modrinth:power-grid:jCkPHjmP'
    // User-approved island oil supply, 2026-10-15. Exact 1.21.1 NeoForge release.
    localRuntime 'maven.modrinth:create-diesel-generators:UoPH8lO1'
    // Development tools approved on 2026-10-14; Rhino is KubeJS's required engine.
    localRuntime 'maven.modrinth:worldedit:WTAFvuRx'
    localRuntime 'maven.modrinth:probejs:xC9KUA7R'
    localRuntime 'maven.modrinth:kubejs:THIGFPwf'
    localRuntime 'maven.modrinth:rhino:SqkDvOLG'
    localRuntime 'maven.modrinth:spark:v5qtqRQi'
    localRuntime 'maven.modrinth:jade:eYz2YBGT'
    // User-approved recipe, navigation and information helpers (2026-10-14).
    localRuntime 'maven.modrinth:jei:ufHUqt9b'
    localRuntime 'maven.modrinth:just-enough-resources-jer:TgNFki8j'
    localRuntime 'maven.modrinth:xaeros-minimap:irjR7dHk'
    localRuntime 'maven.modrinth:xaeros-world-map:SnQ4SoDe'
    localRuntime 'maven.modrinth:betterf3:maXNB1dn'
    localRuntime 'maven.modrinth:cloth-config:izKINKFg'
    localRuntime 'maven.modrinth:jade-sable-compat:cxUohR7A'
    // 用户于2026-10-17确认加入驾驶舱模块化控制面板。
    localRuntime 'maven.modrinth:dashpanels:aH1Oe6Kk'
    // 用户于2026-10-19确认，用于世界5设计艇及原生蓝图导入。
    localRuntime 'maven.modrinth:create-aeronautics-toolgun:pcD0Yutw'
    localRuntime 'maven.modrinth:create-aeronautics-transmission-linkage:FCZZ3ED4'
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = file('../../runtime/client')
            programArguments.addAll '--username', 'DBVDeveloper'
            jvmArguments.addAll '-Xmx4G'
            jvmArguments.add '-Ddbv.construction=' + providers.gradleProperty('dbvConstruction').getOrElse('false')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        dbv_world { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// NBT snapshot recovery tests need Minecraft's mapped classes, without launching a client.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.named('test', Test) { useJUnitPlatform() }
